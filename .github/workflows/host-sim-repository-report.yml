name: Host Simulation Repository Report

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Arduino Host Simulation Tests"
      - "Host Simulation Memory Profiles"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  build-repository-host-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download latest standard host report artifact
        uses: dawidd6/action-download-artifact@v23
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: arduino-host-sim-tests.yml
          workflow_conclusion: success
          branch: main
          name: host-sim-test-report
          if_no_artifact_found: warn
          path: .artifacts/standard

      - name: Download latest stress report artifact
        uses: dawidd6/action-download-artifact@v23
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: host-sim-memory-profiles.yml
          workflow_conclusion: success
          branch: main
          name: host-sim-stress-report
          if_no_artifact_found: warn
          path: .artifacts/stress

      - name: Generate repository-level host simulation report
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/generate_host_sim_repository_report.py \
            --standard-dir .artifacts/standard \
            --stress-dir .artifacts/stress \
            --output-md reports/host-sim-repository-report.md \
            --output-json reports/host-sim-repository-report.json

          cat reports/host-sim-repository-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repository-level host simulation report
        uses: actions/upload-artifact@v7
        with:
          name: host-sim-repository-report
          path: |
            reports/host-sim-repository-report.md
            reports/host-sim-repository-report.json
          if-no-files-found: error
