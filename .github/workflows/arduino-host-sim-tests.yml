name: Arduino Host Simulation Tests

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/arduino-host-sim-tests.yml"
      - "test/host_arduino_sim/**"
      - "lib/**"
      - "src/**"
      - "library.properties"
      - "library.json"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/arduino-host-sim-tests.yml"
      - "test/host_arduino_sim/**"
      - "lib/**"
      - "src/**"
      - "library.properties"
      - "library.json"
  workflow_dispatch:
    inputs:
      target_library_path:
        description: "Optional relative library path (example: lib/ArrayList or . for root)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  discover-libraries:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      compile_matrix: ${{ steps.discover.outputs.compile_matrix }}
      has_targets: ${{ steps.discover.outputs.has_targets }}
      count: ${{ steps.discover.outputs.count }}
      compile_count: ${{ steps.discover.outputs.compile_count }}
      targets_display: ${{ steps.discover.outputs.targets_display }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Discover Arduino-style libraries
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          TARGET_INPUT="${{ github.event.inputs.target_library_path || '' }}"

          DISCOVERY_JSON="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ.get("TARGET_INPUT", "").strip()
          config_path = Path("test/host_arduino_sim/host_test_matrix.json")
          root = Path(".")

          def is_arduino_library(path: Path) -> bool:
            return (path / "library.properties").is_file() and (path / "src").is_dir()

          results = []

          if target:
            target_path = Path(target)
            if str(target_path) == ".":
              target_path = Path(".")

            if not is_arduino_library(target_path):
              raise SystemExit(f"Requested target_library_path '{target}' is not an Arduino-style library (missing library.properties or src/)")

            results = [str(target_path).replace('\\\\', '/').rstrip('/') or '.']
          else:
            if is_arduino_library(root):
              results.append(".")

            lib_dir = Path("lib")
            if lib_dir.is_dir():
              for child in sorted(lib_dir.iterdir()):
                if child.is_dir() and is_arduino_library(child):
                  results.append(str(child).replace('\\\\', '/'))

          # Deduplicate while preserving order.
          deduped = []
          seen = set()
          for item in results:
            if item not in seen:
              seen.add(item)
              deduped.append(item)

          compile_defaults = {
            "backends": ["sd", "littlefs"],
            "optionalModes": ["off"]
          }
          config = {}
          if config_path.is_file():
            config = json.loads(config_path.read_text(encoding="utf-8"))
            compile_defaults = config.get("defaults", {}).get("compile", compile_defaults)

          backends_default = compile_defaults.get("backends", ["sd", "littlefs"])
          optional_default = compile_defaults.get("optionalModes", ["off"])
          per_library = config.get("libraries", {})

          compile_targets = []
          for library_path in deduped:
            library_cfg = per_library.get(library_path, {})
            compile_cfg = library_cfg.get("compile", {})
            backends = compile_cfg.get("backends", backends_default)
            optional_modes = compile_cfg.get("optionalModes", optional_default)

            for backend in backends:
              for optional in optional_modes:
                compile_targets.append({
                  "libraryPath": library_path,
                  "backend": backend,
                  "optional": optional
                })

          print(json.dumps({
            "matrix": deduped,
            "compile_matrix": compile_targets,
            "compile_count": len(compile_targets),
            "count": len(deduped),
            "has_targets": bool(deduped),
            "targets_display": ", ".join(deduped) if deduped else "(none)",
          }))
          PY
          )"

          echo "Discovery payload: ${DISCOVERY_JSON}"

          MATRIX_JSON="$(printf '%s' "${DISCOVERY_JSON}" | jq -c '.matrix')"
          COMPILE_MATRIX_JSON="$(printf '%s' "${DISCOVERY_JSON}" | jq -c '.compile_matrix')"
          COMPILE_COUNT_VALUE="$(printf '%s' "${DISCOVERY_JSON}" | jq -r '.compile_count')"
          COUNT_VALUE="$(printf '%s' "${DISCOVERY_JSON}" | jq -r '.count')"
          HAS_TARGETS_VALUE="$(printf '%s' "${DISCOVERY_JSON}" | jq -r '.has_targets')"
          TARGETS_DISPLAY_VALUE="$(printf '%s' "${DISCOVERY_JSON}" | jq -r '.targets_display')"

          {
            echo "matrix=${MATRIX_JSON}"
            echo "compile_matrix=${COMPILE_MATRIX_JSON}"
            echo "compile_count=${COMPILE_COUNT_VALUE}"
            echo "count=${COUNT_VALUE}"
            echo "has_targets=${HAS_TARGETS_VALUE}"
            echo "targets_display=${TARGETS_DISPLAY_VALUE}"
          } >> "$GITHUB_OUTPUT"
        env:
          TARGET_INPUT: ${{ github.event.inputs.target_library_path || '' }}

      - name: Log discovery results
        shell: bash
        run: |
          echo "Discovered library targets count: ${{ steps.discover.outputs.count }}"
          echo "Discovered library has_targets: ${{ steps.discover.outputs.has_targets }}"
          echo "Discovered library targets: ${{ steps.discover.outputs.targets_display }}"
          echo "Discovered library matrix: ${{ steps.discover.outputs.matrix }}"
          echo "Discovered compile matrix count: ${{ steps.discover.outputs.compile_count }}"
          echo "Discovered compile matrix: ${{ steps.discover.outputs.compile_matrix }}"

  host-library-compile:
    name: host-library-compile (${{ matrix.target.libraryPath }}, ${{ matrix.target.backend }}, ${{ matrix.target.optional }})
    needs: discover-libraries
    if: needs.discover-libraries.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover-libraries.outputs.compile_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log current matrix target
        shell: bash
        run: |
          echo "Compiling host smoke target for library path: ${{ matrix.target.libraryPath }}"
          echo "Backend: ${{ matrix.target.backend }}"
          echo "Optional mode: ${{ matrix.target.optional }}"

      - name: Prepare host shim headers
        id: shim
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "test/host_arduino_sim/include" ]; then
            echo "shim_dir=test/host_arduino_sim/include" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p .github/tmp-host-shim

          cat > .github/tmp-host-shim/Arduino.h <<'EOF'
          #ifndef HOST_ARDUINO_SIM_ARDUINO_H
          #define HOST_ARDUINO_SIM_ARDUINO_H
          #include <cstdlib>
          #include <cstdint>
          #include <iomanip>
          #include <iostream>
          #include <string>
          using byte = std::uint8_t;
          class String : public std::string {
          public:
              using std::string::string;
              String() : std::string() {}
              String(const char* s) : std::string(s ? s : "") {}
              String(const std::string& s) : std::string(s) {}
              String(char c) : std::string(1, c) {}
              String(int v) : std::string(std::to_string(v)) {}
              String(unsigned int v) : std::string(std::to_string(v)) {}
              String(long v) : std::string(std::to_string(v)) {}
              String(unsigned long v) : std::string(std::to_string(v)) {}
              String(float v) : std::string(std::to_string(v)) {}
              String(double v) : std::string(std::to_string(v)) {}
              long toInt() const {
                char* end = nullptr;
                const long value = std::strtol(this->c_str(), &end, 10);
                return (end == this->c_str()) ? 0L : value;
              }
              float toFloat() const {
                char* end = nullptr;
                const float value = std::strtof(this->c_str(), &end);
                return (end == this->c_str()) ? 0.0f : value;
              }
                String substring(unsigned int from) const {
                  if (from >= this->size()) { return String(""); }
                  return String(this->substr(from));
                }
                String substring(unsigned int from, unsigned int to) const {
                  if (from >= this->size()) { return String(""); }
                  if (to > this->size()) { to = static_cast<unsigned int>(this->size()); }
                  if (to <= from) { return String(""); }
                  return String(this->substr(from, to - from));
                }
          };
          constexpr uint8_t LOW = 0;
          constexpr uint8_t HIGH = 1;
          constexpr uint8_t INPUT = 0;
          constexpr uint8_t OUTPUT = 1;
          constexpr uint8_t LED_BUILTIN = 13;
          constexpr int DEC = 10;
          constexpr int HEX = 16;
          constexpr int OCT = 8;
          constexpr int BIN = 2;
          inline void pinMode(uint8_t, uint8_t) {}
          inline void digitalWrite(uint8_t, uint8_t) {}
          template <typename T>
          inline T min(const T& a, const T& b) { return (a < b) ? a : b; }
          template <typename T>
          inline T max(const T& a, const T& b) { return (a > b) ? a : b; }
          class HostSerial {
          public:
              void begin(unsigned long) {}
              void flush() {}
              template <typename T> void print(const T& value) { std::cout << value; }
              template <typename T> void println(const T& value) { std::cout << value << std::endl; }
              template <typename T>
              void print(const T& value, int base) {
                  if (base == HEX) { std::cout << std::hex << value << std::dec; return; }
                  if (base == OCT) { std::cout << std::oct << value << std::dec; return; }
                  std::cout << value;
              }
              template <typename T>
              void println(const T& value, int base) {
                  print(value, base);
                  std::cout << std::endl;
              }
              void println() { std::cout << std::endl; }
              explicit operator bool() const { return true; }
          };
          inline HostSerial Serial;
          inline unsigned long millis() { return 0UL; }
          inline void delay(unsigned long) {}
          inline void randomSeed(unsigned long seed) { std::srand(static_cast<unsigned int>(seed)); }
          inline long random(long max) {
              if (max <= 0) { return 0; }
              return static_cast<long>(std::rand() % max);
          }
          inline long random(long min, long max) {
              if (max <= min) { return min; }
              return min + random(max - min);
          }
          #endif
          EOF

          cat > .github/tmp-host-shim/SPI.h <<'EOF'
          #ifndef HOST_ARDUINO_SIM_SPI_H
          #define HOST_ARDUINO_SIM_SPI_H
          class SPIClass { public: void begin() {} };
          inline SPIClass SPI;
          #endif
          EOF

          cat > .github/tmp-host-shim/Ethernet.h <<'EOF'
          #ifndef HOST_ARDUINO_SIM_ETHERNET_H
          #define HOST_ARDUINO_SIM_ETHERNET_H
          #include "Arduino.h"
          #include <cstddef>
          #include <cstdint>
          #include <cstring>
          class IPAddress {
          public:
              IPAddress() : _address{0, 0, 0, 0} {}
              IPAddress(uint8_t a, uint8_t b, uint8_t c, uint8_t d) : _address{a, b, c, d} {}
              uint8_t operator[](size_t index) const { return index < 4 ? _address[index] : 0; }
              uint8_t& operator[](size_t index) {
                  if (index >= 4) { static uint8_t dummy = 0; return dummy; }
                  return _address[index];
              }
          private:
              uint8_t _address[4];
          };
          enum EthernetLinkStatus { Unknown, LinkON, LinkOFF };
          enum EthernetHardwareStatus { EthernetNoHardware, EthernetW5100, EthernetW5200, EthernetW5500 };
          class EthernetClient {
          public:
              EthernetClient() : _connected(false) {}
              bool connect(const char*, uint16_t) { _connected = true; return true; }
              bool connect(const IPAddress&, uint16_t) { _connected = true; return true; }
              int available() const { return 0; }
              int read() { return -1; }
              int read(uint8_t*, size_t) { return 0; }
              size_t write(uint8_t) { return 1; }
              size_t write(const uint8_t*, size_t size) { return size; }
              size_t print(const String& value) { return value.length(); }
              size_t print(const char* value) { return value ? std::strlen(value) : 0; }
              size_t print(char) { return 1; }
              size_t print(int) { return 1; }
              size_t print(unsigned long) { return 1; }
              size_t println() { return 2; }
              size_t println(const String& value) { return value.length() + 2; }
              size_t println(const char* value) { return (value ? std::strlen(value) : 0) + 2; }
              bool connected() const { return _connected; }
              void stop() { _connected = false; }
              explicit operator bool() const { return true; }
          private:
              bool _connected;
          };
          class EthernetServer {
          public:
              explicit EthernetServer(uint16_t) {}
              void begin() {}
              EthernetClient available() { return EthernetClient(); }
          };
          class EthernetClass {
          public:
              EthernetClass()
                  : _localIp(192, 168, 1, 200), _dnsIp(8, 8, 8, 8), _gatewayIp(192, 168, 1, 1),
                    _subnetIp(255, 255, 255, 0), _linkStatus(LinkON), _hardwareStatus(EthernetW5500) {}
              void init(uint8_t) {}
              int begin(uint8_t*, unsigned long = 0) { return 1; }
              void begin(uint8_t*, const IPAddress& ip, const IPAddress& dns, const IPAddress& gateway, const IPAddress& subnet) {
                  _localIp = ip;
                  _dnsIp = dns;
                  _gatewayIp = gateway;
                  _subnetIp = subnet;
              }
              IPAddress localIP() const { return _localIp; }
              IPAddress dnsServerIP() const { return _dnsIp; }
              IPAddress gatewayIP() const { return _gatewayIp; }
              IPAddress subnetMask() const { return _subnetIp; }
              void setRetransmissionTimeout(uint16_t) {}
              void setRetransmissionCount(uint8_t) {}
              EthernetLinkStatus linkStatus() const { return _linkStatus; }
              EthernetHardwareStatus hardwareStatus() const { return _hardwareStatus; }
          private:
              IPAddress _localIp;
              IPAddress _dnsIp;
              IPAddress _gatewayIp;
              IPAddress _subnetIp;
              EthernetLinkStatus _linkStatus;
              EthernetHardwareStatus _hardwareStatus;
          };
          inline EthernetClass Ethernet;
          #endif
          EOF

          cat > .github/tmp-host-shim/SdFat.h <<'EOF'
          #ifndef HOST_ARDUINO_SIM_SDFAT_H
          #define HOST_ARDUINO_SIM_SDFAT_H
          #include "Arduino.h"
          #include <cstddef>
          #include <cstdint>
          constexpr uint8_t O_READ = 0x01;
          constexpr uint8_t O_WRITE = 0x02;
          constexpr uint8_t O_CREAT = 0x04;
          #ifndef SD_CS_PIN
          #define SD_CS_PIN 4
          #endif
          #ifndef SD_SCK_MHZ
          #define SD_SCK_MHZ(x) (x)
          #endif
          class FsFile {
          public:
              explicit operator bool() const { return true; }
              int read() { return -1; }
              int read(void*, size_t) { return 0; }
              size_t write(const void*, size_t size) { return size; }
              size_t write(uint8_t) { return 1; }
              void close() {}
          };
          class SdCardMock { public: uint32_t sectorCount() const { return 4UL * 1024UL * 1024UL; } };
          class SdVolumeMock {
          public:
              uint32_t freeClusterCount() const { return 32768UL; }
              uint32_t clusterCount() const { return 65536UL; }
              uint32_t sectorsPerCluster() const { return 8UL; }
          };
          class SdFat {
          public:
              bool begin() { return true; }
              bool begin(uint8_t, uint32_t = 0) { return true; }
              FsFile open(const char*, uint8_t = O_READ) { return FsFile(); }
              FsFile open(const String&, uint8_t = O_READ) { return FsFile(); }
              SdCardMock* card() { return &_card; }
              SdVolumeMock* vol() { return &_vol; }
          private:
              SdCardMock _card;
              SdVolumeMock _vol;
          };
          using SdFile = FsFile;
          #endif
          EOF

          cat > .github/tmp-host-shim/SDFat.h <<'EOF'
          #ifndef HOST_ARDUINO_SIM_SDFAT_COMPAT_H
          #define HOST_ARDUINO_SIM_SDFAT_COMPAT_H
          #include "SdFat.h"
          #endif
          EOF

            cat > .github/tmp-host-shim/RTClib.h <<'EOF'
            #ifndef HOST_ARDUINO_SIM_RTCLIB_H
            #define HOST_ARDUINO_SIM_RTCLIB_H
            #include "Arduino.h"
            class DateTime {
            public:
              DateTime() : _year(1970), _month(1), _day(1), _hour(0), _minute(0), _second(0) {}
              DateTime(int year, int month, int day, int hour, int minute, int second)
                : _year(year), _month(month), _day(day), _hour(hour), _minute(minute), _second(second) {}
              unsigned long unixtime() const { return millis() / 1000UL; }
              String timestamp() const {
                return String(_year) + "-" + String(_month) + "-" + String(_day) + " " +
                   String(_hour) + ":" + String(_minute) + ":" + String(_second);
              }
            private:
              int _year;
              int _month;
              int _day;
              int _hour;
              int _minute;
              int _second;
            };
            class RTC_DS3231 {
            public:
              bool begin() { return true; }
              DateTime now() const { return _current; }
              void adjust(const DateTime& value) { _current = value; }
            private:
              DateTime _current;
            };
            #endif
            EOF

            cat > .github/tmp-host-shim/lz4.h <<'EOF'
            #ifndef HOST_ARDUINO_SIM_LZ4_H
            #define HOST_ARDUINO_SIM_LZ4_H
            #include <cstring>
            inline int LZ4_compress_default(const char* src, char* dst, int srcSize, int dstCapacity) {
              if (!src || !dst || srcSize < 0 || dstCapacity < 0) { return 0; }
              if (srcSize > dstCapacity) { return 0; }
              if (srcSize == 0) { return 0; }
              std::memcpy(dst, src, static_cast<size_t>(srcSize));
              return srcSize;
            }
            inline int LZ4_decompress_safe(const char* src, char* dst, int compressedSize, int dstCapacity) {
              if (!src || !dst || compressedSize < 0 || dstCapacity < 0) { return -1; }
              if (compressedSize > dstCapacity) { return -1; }
              if (compressedSize == 0) { return 0; }
              std::memcpy(dst, src, static_cast<size_t>(compressedSize));
              return compressedSize;
            }
            #endif
            EOF

          cat > .github/tmp-host-shim/SD.h <<'EOF'
          #ifndef HOST_ARDUINO_SIM_SD_H
          #define HOST_ARDUINO_SIM_SD_H
          #include "Arduino.h"
          #include <cstddef>
          #include <cstdint>
          constexpr std::uint8_t FILE_READ = 0x01;
          constexpr std::uint8_t FILE_WRITE = 0x02;
          class File {
          public:
              explicit operator bool() const { return false; }
              bool seek(std::uint32_t) { return false; }
              std::size_t write(const std::uint8_t*, std::size_t) { return 0; }
              std::size_t read(std::uint8_t*, std::size_t) { return 0; }
              void close() {}
          };
          class SDClass {
          public:
              bool begin(int) { return true; }
              bool exists(const String&) const { return false; }
              bool remove(const String&) const { return true; }
              File open(const String&, std::uint8_t) const { return File(); }
          };
          inline SDClass SD;
          #endif
          EOF

          cat > .github/tmp-host-shim/LittleFS.h <<'EOF'
          #ifndef HOST_ARDUINO_SIM_LITTLEFS_H
          #define HOST_ARDUINO_SIM_LITTLEFS_H
          #include "SD.h"
          inline SDClass LittleFS;
          #endif
          EOF

          echo "shim_dir=.github/tmp-host-shim" >> "$GITHUB_OUTPUT"

      - name: Validate header include casing
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          lib_path = Path("${{ matrix.target.libraryPath }}")
          src_dir = lib_path / "src"
          props = lib_path / "library.properties"

          # Build include search roots used by host smoke compile.
          search_roots = [src_dir]
          lib_root = Path("lib")
          if lib_root.is_dir():
              for child in sorted(lib_root.iterdir()):
                  child_src = child / "src"
                  if child.is_dir() and child_src.is_dir():
                      search_roots.append(child_src)
          if Path("src").is_dir():
              search_roots.append(Path("src"))

          include_re = re.compile(r'^\s*#\s*include\s*"([^"]+)"')
          skip = {"Arduino.h", "SD.h", "SPI.h", "LittleFS.h"}

          # Lowercase index for case mismatch detection.
          root_indices = {}
          for root in search_roots:
              idx = {}
              for f in root.rglob("*"):
                  if f.is_file():
                      rel = f.relative_to(root).as_posix()
                      idx[rel.lower()] = rel
              root_indices[root] = idx

          problems = []

          # 1) Validate library.properties includes entries match actual file case in this library src.
          if props.is_file():
              includes_value = None
              for line in props.read_text(encoding="utf-8", errors="ignore").splitlines():
                  if line.strip().startswith("includes="):
                      includes_value = line.split("=", 1)[1].strip()
                      break

              if includes_value:
                  declared = [s.strip() for s in includes_value.split(",") if s.strip()]
                  src_name_map = {p.name.lower(): p.name for p in src_dir.glob("*") if p.is_file()}
                  for inc in declared:
                      exact_path = src_dir / inc
                      if exact_path.is_file():
                          continue
                      actual_name = src_name_map.get(inc.lower())
                      if actual_name:
                          problems.append(
                              f"{props.as_posix()}: includes entry '{inc}' has wrong case, expected '{actual_name}'"
                          )
                      else:
                          problems.append(
                              f"{props.as_posix()}: includes entry '{inc}' not found in {src_dir.as_posix()}"
                          )

          # 2) Validate local source includes do not reference differently-cased headers.
          source_files = [
              p for p in src_dir.rglob("*")
              if p.is_file() and p.suffix.lower() in {".h", ".hpp", ".hh", ".c", ".cc", ".cpp", ".ino"}
          ]

          for sf in source_files:
              for line_no, line in enumerate(sf.read_text(encoding="utf-8", errors="ignore").splitlines(), 1):
                  m = include_re.match(line)
                  if not m:
                      continue
                  inc = m.group(1)
                  if inc in skip:
                      continue

                  # Exact resolution in any search root passes.
                  exact = any((root / inc).is_file() for root in search_roots)
                  if exact:
                      continue

                  # If exact failed but lowercase resolution exists, this is a case mismatch.
                  for root, idx in root_indices.items():
                      actual_rel = idx.get(inc.lower())
                      if actual_rel and actual_rel != inc:
                          problems.append(
                              f"{sf.as_posix()}:{line_no}: include '{inc}' has wrong case, expected '{actual_rel}' (from {root.as_posix()})"
                          )
                          break

          if problems:
              print("Header include casing/declaration validation failed:")
              for p in problems:
                  print(f" - {p}")
              sys.exit(1)

          print(f"Header include casing/declaration validation passed for {lib_path.as_posix()}")
          PY

      - name: Build per-library host compile smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail

          LIB_PATH="${{ matrix.target.libraryPath }}"
          LIB_NAME="$(basename "${LIB_PATH}")"
          if [ "${LIB_PATH}" = "." ]; then
            LIB_NAME="root"
          fi

          LIB_SLUG="$(echo "${LIB_PATH}" | tr '/\\.' '___')"
          if [ -z "${LIB_SLUG}" ]; then
            LIB_SLUG="root"
          fi

          OUT_DIR="test/host_arduino_sim/out/library-smoke/${LIB_SLUG}/${{ matrix.target.backend }}/${{ matrix.target.optional }}"
          mkdir -p "${OUT_DIR}"

          echo "lib_slug=${LIB_SLUG}" >> "$GITHUB_OUTPUT"
          echo "out_dir=${OUT_DIR}" >> "$GITHUB_OUTPUT"

          EXTRA_FLAGS=()
          if [ "${{ matrix.target.backend }}" = "littlefs" ]; then
            EXTRA_FLAGS+=("-DUSE_LITTLEFS")
          fi
          if [ "${{ matrix.target.optional }}" = "on" ]; then
            EXTRA_FLAGS+=("-DJSON_ENABLE_OPTIONAL_RETURNS=1")
            EXTRA_FLAGS+=("-DAVL_TREE_ENABLE_ERROR_CODES=1")
          fi

          ARCH_FLAGS="-D_AVR_ATmega2560_"

          INCLUDE_FLAGS=(
            "-I${{ steps.shim.outputs.shim_dir }}"
            "-I${LIB_PATH}/src"
          )

          # Add all monorepo library src paths so cross-library includes resolve.
          if [ -d "lib" ]; then
            while IFS= read -r src_dir; do
              INCLUDE_FLAGS+=("-I${src_dir}")
            done < <(find lib -mindepth 2 -maxdepth 2 -type d -name src | sort)
          fi

          # Include root src for repositories that expose shared headers there.
          if [ -d "src" ]; then
            INCLUDE_FLAGS+=("-Isrc")
          fi

          python3 - <<'PY' > "${OUT_DIR}/smoke.cpp"
          import os
          from pathlib import Path

          lib_path = Path(os.environ["LIB_PATH"])
          src_dir = lib_path / "src"
          props = lib_path / "library.properties"

          includes = []
          if props.is_file():
              for line in props.read_text(encoding="utf-8", errors="ignore").splitlines():
                  if line.strip().startswith("includes="):
                      raw = line.split("=", 1)[1].strip()
                      includes = [item.strip() for item in raw.split(",") if item.strip()]
                      break

          if not includes:
              headers = sorted(src_dir.glob("*.h"))
              if headers:
                  includes = [headers[0].name]

          if not includes:
              raise SystemExit(f"No includable header found for {lib_path}")

          print('#include "Arduino.h"')
          print('#include "SD.h"')
          print('#ifdef USE_LITTLEFS')
          print('#include "LittleFS.h"')
          print('#endif')
          for inc in includes:
              print(f'#include "{inc}"')
          print('int main() { return 0; }')
          PY

          g++ -std=c++17 -O2 -DAL_NO_SERIAL "${EXTRA_FLAGS[@]}" ${ARCH_FLAGS} \
            "${INCLUDE_FLAGS[@]}" \
            "${OUT_DIR}/smoke.cpp" \
            -c -o "${OUT_DIR}/smoke.o"
        env:
          LIB_PATH: ${{ matrix.target.libraryPath }}

      - name: Upload per-library compile artifact
        if: always() && steps.smoke.outputs.out_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: host-library-compile-${{ steps.smoke.outputs.lib_slug }}-${{ matrix.target.backend }}-${{ matrix.target.optional }}
          path: ${{ steps.smoke.outputs.out_dir }}
          if-no-files-found: warn

  host-sim-integration:
    needs:
      - discover-libraries
      - host-library-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sd, littlefs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check integration prerequisites
        id: precheck
        shell: bash
        run: |
          set -euo pipefail

          required=(
            test/host_arduino_sim/host_arduino_sim_tests.cpp
            test/host_arduino_sim/include/Arduino.h
            test/host_arduino_sim/include/SD.h
            test/host_arduino_sim/include/LittleFS.h
            test/host_arduino_sim/include/SPI.h
            lib/ArrayList/src/ArrayList.h
            lib/AVLTree/src/AVLTree.h
            lib/Hashtable/src/Hashtable.h
            lib/SimpleVector/src/SimpleVector.h
            lib/SDList/src/SDList.h
            lib/TypeTraits/src/TypeTraits.h
          )

          missing=0
          for file in "${required[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "Missing required integration file: ${file}"
              missing=1
            fi
          done

          if [ "${missing}" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=all required integration files are present" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing one or more integration-only files under test/host_arduino_sim or required dependency headers" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip integration runner when prerequisites are missing
        if: steps.precheck.outputs.run != 'true'
        shell: bash
        run: |
          echo "Skipping host-sim integration runner only."
          echo "Reason: ${{ steps.precheck.outputs.reason }}"
          echo "Per-library host compile job is independent and controlled by discover-libraries outputs."

      - name: Build host simulation runner
        if: steps.precheck.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test/host_arduino_sim/out/bin

          EXTRA_FLAGS=""
          if [ "${{ matrix.backend }}" = "littlefs" ]; then
            EXTRA_FLAGS="-DUSE_LITTLEFS"
          fi

          ARCH_FLAGS="-D_AVR_ATmega2560_"

          g++ -std=c++17 -O2 \
            -DAL_NO_SERIAL ${EXTRA_FLAGS} ${ARCH_FLAGS} \
            -Itest/host_arduino_sim/include \
            -Ilib/ArrayList/src \
            -Ilib/AVLTree/src \
            -Ilib/Hashtable/src \
            -Ilib/Json/src \
            -Ilib/MathLib/src \
            -Ilib/SimpleVector/src \
            -Ilib/SDList/src \
            -Ilib/String/src \
            -Ilib/TypeTraits/src \
            lib/Json/src/JSON.cpp \
            test/host_arduino_sim/host_arduino_sim_tests.cpp \
            -o test/host_arduino_sim/out/bin/host_arduino_sim_${{ matrix.backend }}

      - name: Run host simulation tests
        if: steps.precheck.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          REPORT_PATH="test/host_arduino_sim/out/report-${{ matrix.backend }}.json"
          STATS_PATH="test/host_arduino_sim/out/stats-${{ matrix.backend }}.json"
          FS_ROOT="test/host_arduino_sim/out/fs-${{ matrix.backend }}"

          HOST_SIM_REPORT="${REPORT_PATH}" \
          HOST_SIM_STATS_REPORT="${STATS_PATH}" \
          HOST_SIM_FS_ROOT="${FS_ROOT}" \
          ./test/host_arduino_sim/out/bin/host_arduino_sim_${{ matrix.backend }}

      - name: Build host simulation runner (optional returns)
        if: steps.precheck.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_FLAGS=""
          if [ "${{ matrix.backend }}" = "littlefs" ]; then
            EXTRA_FLAGS="-DUSE_LITTLEFS"
          fi

          ARCH_FLAGS="-D_AVR_ATmega2560_"

          g++ -std=c++17 -O2 \
            -DAL_NO_SERIAL ${EXTRA_FLAGS} ${ARCH_FLAGS} \
            -DJSON_ENABLE_OPTIONAL_RETURNS=1 \
            -DAVL_TREE_ENABLE_ERROR_CODES=1 \
            -Itest/host_arduino_sim/include \
            -Ilib/ArrayList/src \
            -Ilib/AVLTree/src \
            -Ilib/Hashtable/src \
            -Ilib/Json/src \
            -Ilib/MathLib/src \
            -Ilib/Optional/src \
            -Ilib/SimpleVector/src \
            -Ilib/SDList/src \
            -Ilib/String/src \
            -Ilib/TypeTraits/src \
            lib/Json/src/JSON.cpp \
            test/host_arduino_sim/host_arduino_sim_tests.cpp \
            -o test/host_arduino_sim/out/bin/host_arduino_sim_optional_${{ matrix.backend }}

      - name: Run host simulation tests (optional returns)
        if: steps.precheck.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          REPORT_PATH="test/host_arduino_sim/out/report-optional-${{ matrix.backend }}.json"
          STATS_PATH="test/host_arduino_sim/out/stats-optional-${{ matrix.backend }}.json"
          FS_ROOT="test/host_arduino_sim/out/fs-optional-${{ matrix.backend }}"

          HOST_SIM_REPORT="${REPORT_PATH}" \
          HOST_SIM_STATS_REPORT="${STATS_PATH}" \
          HOST_SIM_FS_ROOT="${FS_ROOT}" \
          ./test/host_arduino_sim/out/bin/host_arduino_sim_optional_${{ matrix.backend }}

      - name: Upload host simulation report
        if: always() && steps.precheck.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: host-arduino-sim-${{ matrix.backend }}
          path: test/host_arduino_sim/out/report-${{ matrix.backend }}.json
          if-no-files-found: error

      - name: Upload host simulation report (optional returns)
        if: always() && steps.precheck.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: host-arduino-sim-optional-${{ matrix.backend }}
          path: test/host_arduino_sim/out/report-optional-${{ matrix.backend }}.json
          if-no-files-found: error

      - name: Upload host simulation memory stats
        if: always() && steps.precheck.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: host-arduino-sim-stats-${{ matrix.backend }}
          path: test/host_arduino_sim/out/stats-${{ matrix.backend }}.json
          if-no-files-found: error

      - name: Upload host simulation memory stats (optional returns)
        if: always() && steps.precheck.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: host-arduino-sim-stats-optional-${{ matrix.backend }}
          path: test/host_arduino_sim/out/stats-optional-${{ matrix.backend }}.json
          if-no-files-found: error

  host-sim-report:
    needs:
      - discover-libraries
      - host-library-compile
      - host-sim-integration
    if: always() && needs.discover-libraries.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download host simulation artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: host-arduino-sim*
          merge-multiple: true
          path: .artifacts/host-sim

      - name: Download compile smoke artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: host-library-compile-*
          merge-multiple: true
          path: .artifacts/host-compile

      - name: Generate consolidated host simulation report
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/generate_host_sim_report.py \
            --mode standard \
            --artifacts-dir .artifacts \
            --output-md reports/host-sim-test-report.md \
            --output-json reports/host-sim-test-report.json \
            --expected-library-count "${{ needs.discover-libraries.outputs.count }}" \
            --expected-compile-smoke-count "${{ needs.discover-libraries.outputs.compile_count }}"

          cat reports/host-sim-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated host simulation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-sim-test-report
          path: |
            reports/host-sim-test-report.md
            reports/host-sim-test-report.json
          if-no-files-found: error

  sync-systemcommands-status-labels:
    needs:
      - discover-libraries
      - host-library-compile
      - host-sim-integration
      - host-sim-report
    if: always() && github.event_name != 'pull_request' && needs.discover-libraries.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Sync SystemCommands status bucket labels
        uses: actions/github-script@v9
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          DISCOVERED_MATRIX_JSON: ${{ needs.discover-libraries.outputs.matrix }}
          COMPILE_MATRIX_JSON: ${{ needs.discover-libraries.outputs.compile_matrix }}
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          script: |
            const tokenPresent = Boolean(process.env.GH_PROJECT_TOKEN && process.env.GH_PROJECT_TOKEN.trim());
            if (!tokenPresent) {
              core.notice('Skipping SystemCommands status sync because GH_PROJECT_TOKEN is not set.');
              return;
            }

            const TARGET_OWNER = 'braydenanderson2014';
            const TARGET_REPO = 'SystemCommands';
            const ISSUE_TESTED = 22;
            const ISSUE_NOT_TESTED = 23;
            const ISSUE_COMPILATION_PASSED = 28;
            const ISSUE_COMPILATION_FAILED = 29;
            const ISSUE_TESTING_FAILED = 33;

            const normalize = (value) => String(value || '')
              .toLowerCase()
              .replace(/fs/g, 'filesystem')
              .replace(/[^a-z0-9]/g, '');

            const parseJsonArray = (raw) => {
              if (!raw || !raw.trim()) return [];
              try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
              } catch {
                return [];
              }
            };

            const discoveredTargets = parseJsonArray(process.env.DISCOVERED_MATRIX_JSON);
            if (!discoveredTargets.length) {
              core.info('No discovered targets found, nothing to sync.');
              return;
            }
            const compileTargets = parseJsonArray(process.env.COMPILE_MATRIX_JSON);

            const basename = (path) => {
              if (!path || path === '.') return 'root';
              const parts = String(path).split('/').filter(Boolean);
              return parts.length ? parts[parts.length - 1] : String(path);
            };

            const allRepoLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: TARGET_OWNER,
              repo: TARGET_REPO,
              per_page: 100
            });

            const labelByNormalized = new Map();
            for (const label of allRepoLabels) {
              const key = normalize(label.name);
              if (!labelByNormalized.has(key)) {
                labelByNormalized.set(key, label.name);
              }
            }

            const targetPathToLabel = new Map();
            for (const target of discoveredTargets) {
              if (target === '.') {
                continue;
              }
              const key = normalize(basename(target));
              const resolved = labelByNormalized.get(key) || basename(target);
              targetPathToLabel.set(target, resolved);
            }

            const managedLabels = new Set(Array.from(targetPathToLabel.values()));
            if (!managedLabels.size) {
              core.info('No managed library labels resolved for discovered targets.');
              return;
            }

            const runJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });

            const parseCompileJob = (name) => {
              if (!name || !name.startsWith('host-library-compile')) {
                return null;
              }

              const suffixMatch = name.match(/\((.+)\)\s*$/);
              if (!suffixMatch) {
                return null;
              }

              const inner = suffixMatch[1];
              let parts = inner.split(',').map((s) => s.trim()).filter(Boolean);
              if (parts.length < 2) {
                parts = inner.split('|').map((s) => s.trim()).filter(Boolean);
              }
              if (parts.length < 2) {
                return null;
              }

              return {
                libraryPath: parts[0],
                backend: parts[1],
                optional: parts[2] || 'off'
              };
            };

            const compileByLibrary = new Map();
            for (const job of runJobs) {
              const parsed = parseCompileJob(job.name);
              if (!parsed) continue;

              if (!compileByLibrary.has(parsed.libraryPath)) {
                compileByLibrary.set(parsed.libraryPath, new Map());
              }

              const backendStates = compileByLibrary.get(parsed.libraryPath);
              backendStates.set(`${parsed.backend}|${parsed.optional}`, job.conclusion || 'unknown');
            }

            const compilePassed = new Set();
            const compileFailed = new Set();

            const expectedByLibrary = new Map();
            for (const target of compileTargets) {
              const libraryPath = String(target.libraryPath || '');
              const backend = String(target.backend || '');
              if (!libraryPath || !backend) continue;
              const optional = String(target.optional || 'off');
              const key = `${backend}|${optional}`;
              if (!expectedByLibrary.has(libraryPath)) {
                expectedByLibrary.set(libraryPath, new Set());
              }
              expectedByLibrary.get(libraryPath).add(key);
            }

            for (const target of discoveredTargets) {
              if (target === '.') continue;

              const label = targetPathToLabel.get(target);
              if (!label) continue;

              const backendStates = compileByLibrary.get(target) || new Map();
              const expectedCombos = expectedByLibrary.get(target) || new Set();
              const conclusions = Array.from(expectedCombos).map((combo) => {
                return backendStates.get(combo) || 'missing';
              });
              if (!conclusions.length) {
                conclusions.push('missing');
              }
              const allSuccess = conclusions.every((state) => state === 'success');

              if (allSuccess) {
                compilePassed.add(label);
              } else {
                compileFailed.add(label);
              }
            }

            const integrationJobs = runJobs.filter((job) => String(job.name || '').startsWith('host-sim-integration'));
            const integrationPassed = integrationJobs.length > 0 && integrationJobs.every((job) => job.conclusion === 'success');

            const tested = new Set();
            const failedTesting = new Set();

            if (integrationPassed) {
              for (const label of compilePassed) {
                tested.add(label);
              }
            } else {
              for (const label of compilePassed) {
                failedTesting.add(label);
              }
            }

            const notTested = new Set();
            for (const label of managedLabels) {
              if (!tested.has(label) && !failedTesting.has(label)) {
                notTested.add(label);
              }
            }

            const desiredByIssue = new Map([
              [ISSUE_TESTED, tested],
              [ISSUE_NOT_TESTED, notTested],
              [ISSUE_COMPILATION_PASSED, compilePassed],
              [ISSUE_COMPILATION_FAILED, compileFailed],
              [ISSUE_TESTING_FAILED, failedTesting]
            ]);

            const listIssueLabelNames = async (issueNumber) => {
              const { data } = await github.rest.issues.get({
                owner: TARGET_OWNER,
                repo: TARGET_REPO,
                issue_number: issueNumber
              });

              if (data.pull_request) {
                throw new Error(`Target #${issueNumber} is a pull request, expected an issue.`);
              }

              return (data.labels || [])
                .map((item) => (typeof item === 'string' ? item : item.name || ''))
                .filter(Boolean);
            };

            let addedTotal = 0;
            let removedTotal = 0;

            for (const [issueNumber, desiredSet] of desiredByIssue.entries()) {
              const currentNames = await listIssueLabelNames(issueNumber);
              const currentByLower = new Map();
              for (const name of currentNames) {
                currentByLower.set(name.toLowerCase(), name);
              }

              const desiredLower = new Set(Array.from(desiredSet).map((name) => name.toLowerCase()));
              const managedLower = new Set(Array.from(managedLabels).map((name) => name.toLowerCase()));

              const toAdd = Array.from(desiredSet).filter((name) => !currentByLower.has(name.toLowerCase()));
              if (toAdd.length) {
                await github.rest.issues.addLabels({
                  owner: TARGET_OWNER,
                  repo: TARGET_REPO,
                  issue_number: issueNumber,
                  labels: toAdd
                });
                addedTotal += toAdd.length;
              }

              for (const [labelLower, exactName] of currentByLower.entries()) {
                if (!managedLower.has(labelLower)) {
                  continue;
                }
                if (desiredLower.has(labelLower)) {
                  continue;
                }

                try {
                  await github.rest.issues.removeLabel({
                    owner: TARGET_OWNER,
                    repo: TARGET_REPO,
                    issue_number: issueNumber,
                    name: exactName
                  });
                  removedTotal += 1;
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }
              }
            }

            core.info(`SystemCommands status sync complete. Added labels: ${addedTotal}. Removed labels: ${removedTotal}.`);
            core.info(`Compile passed: ${Array.from(compilePassed).sort().join(', ') || '(none)'}`);
            core.info(`Compile failed: ${Array.from(compileFailed).sort().join(', ') || '(none)'}`);
            core.info(`Tested: ${Array.from(tested).sort().join(', ') || '(none)'}`);
            core.info(`Not tested: ${Array.from(notTested).sort().join(', ') || '(none)'}`);
            core.info(`Failed testing: ${Array.from(failedTesting).sort().join(', ') || '(none)'}`);

            await github.rest.repos.createDispatchEvent({
              owner: TARGET_OWNER,
              repo: TARGET_REPO,
              event_type: 'compile-status-updated',
              client_payload: {
                source_repository: context.repo.repo,
                source_owner: context.repo.owner,
                run_id: context.runId,
                run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                sha: context.sha,
                compile_passed: Array.from(compilePassed).sort(),
                compile_failed: Array.from(compileFailed).sort(),
                tested: Array.from(tested).sort(),
                not_tested: Array.from(notTested).sort(),
                failed_testing: Array.from(failedTesting).sort()
              }
            });

            core.info(`Queued project health refresh in ${TARGET_OWNER}/${TARGET_REPO}.`);
