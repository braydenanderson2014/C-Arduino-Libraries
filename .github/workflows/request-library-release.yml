name: Request Library Release

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Library release request issue number
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: library-release-request-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.repository == 'braydenanderson2014/C-Arduino-Libraries' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'library-release-request'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Authorize and request remote release
        uses: actions/github-script@v9
        env:
          LIBRARY_SYNC_TOKEN: ${{ secrets.LIBRARY_SYNC_TOKEN }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
        with:
          script: |
            const { withApiCredentialFallback } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/library-sync-credentials.cjs`);
            const { requestRelease } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/library-release.cjs`);
            try {
              await requestRelease({
                github, context, core,
                request: operation => withApiCredentialFallback(getOctokit, operation, core)
              });
            } catch (error) {
              core.setFailed(error.message);
            }