name: Host Simulation Memory Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  host-memory-profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boardProfile:
          - board: uno
            sramBytes: 2048
          - board: nano
            sramBytes: 2048
          - board: micro
            sramBytes: 2560
          - board: leonardo
            sramBytes: 2560
          - board: mega2560
            sramBytes: 8192
          - board: due
            sramBytes: 98304
          - board: zero
            sramBytes: 32768
          - board: uno_r4
            sramBytes: 32768
          - board: mkr1000
            sramBytes: 32768
          - board: esp8266
            sramBytes: 81920
          - board: esp32
            sramBytes: 532480
          - board: esp32s3
            sramBytes: 524288
          - board: esp32c3
            sramBytes: 400000
        backend: [sd, littlefs]
        optional: [off, on]

    name: Memory profile (${{ matrix.boardProfile.board }}, ${{ matrix.backend }}, optional-${{ matrix.optional }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build host simulation runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test/host_arduino_sim/out/bin

          EXTRA_FLAGS=""
          if [ "${{ matrix.backend }}" = "littlefs" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} -DUSE_LITTLEFS"
          fi
          if [ "${{ matrix.optional }}" = "on" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} -DJSON_ENABLE_OPTIONAL_RETURNS=1 -Ilib/Optional/src"
          fi

          g++ -std=c++17 -O2 \
            -DAL_NO_SERIAL -D_AVR_ATmega2560_ ${EXTRA_FLAGS} \
            -Itest/host_arduino_sim/include \
            -Ilib/ArrayList/src \
            -Ilib/Hashtable/src \
            -Ilib/Json/src \
            -Ilib/MathLib/src \
            -Ilib/SimpleVector/src \
            -Ilib/SDList/src \
            -Ilib/String/src \
            -Ilib/TypeTraits/src \
            lib/Json/src/JSON.cpp \
            test/host_arduino_sim/host_arduino_sim_tests.cpp \
            -o test/host_arduino_sim/out/bin/host_arduino_sim_${{ matrix.boardProfile.board }}_${{ matrix.backend }}_${{ matrix.optional }}

      - name: Run memory profile tests
        shell: bash
        run: |
          set -euo pipefail

          # Scale physical SRAM to a host-process budget by 1024x.
          MEM_LIMIT_BYTES=$(( ${{ matrix.boardProfile.sramBytes }} * 1024 ))

          REPORT_PATH="test/host_arduino_sim/out/report-memory-${{ matrix.boardProfile.board }}-${{ matrix.backend }}-optional-${{ matrix.optional }}.json"
          STATS_PATH="test/host_arduino_sim/out/stats-memory-${{ matrix.boardProfile.board }}-${{ matrix.backend }}-optional-${{ matrix.optional }}.json"
          FS_ROOT="test/host_arduino_sim/out/fs-memory-${{ matrix.boardProfile.board }}-${{ matrix.backend }}-optional-${{ matrix.optional }}"

          echo "Board: ${{ matrix.boardProfile.board }}"
          echo "SRAM bytes: ${{ matrix.boardProfile.sramBytes }}"
          echo "Host memory limit bytes: ${MEM_LIMIT_BYTES}"

          HOST_MEM_LIMIT_BYTES="${MEM_LIMIT_BYTES}" \
          HOST_MEM_ENFORCE_LIMIT="0" \
          HOST_MEM_ENABLE_CAPACITY_PROBE="1" \
          HOST_MEM_CAPACITY_PROBE_MAX_ELEMENTS="500000" \
          HOST_SIM_REPORT="${REPORT_PATH}" \
          HOST_SIM_STATS_REPORT="${STATS_PATH}" \
          HOST_SIM_FS_ROOT="${FS_ROOT}" \
          ./test/host_arduino_sim/out/bin/host_arduino_sim_${{ matrix.boardProfile.board }}_${{ matrix.backend }}_${{ matrix.optional }}

      - name: Verify all host tests were recorded in stats
        shell: bash
        run: |
          set -euo pipefail

          STATS_PATH="test/host_arduino_sim/out/stats-memory-${{ matrix.boardProfile.board }}-${{ matrix.backend }}-optional-${{ matrix.optional }}.json"
          TEST_COUNT="$(jq '.tests | length' "${STATS_PATH}")"

          # Keep this aligned with the host test runner's full test list.
          MIN_EXPECTED_TESTS=8

          echo "Recorded tests in stats: ${TEST_COUNT}"
          if [ "${TEST_COUNT}" -lt "${MIN_EXPECTED_TESTS}" ]; then
            echo "Expected at least ${MIN_EXPECTED_TESTS} tests in memory profile stats, got ${TEST_COUNT}."
            exit 1
          fi

      - name: Upload memory profile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-memory-report-${{ matrix.boardProfile.board }}-${{ matrix.backend }}-optional-${{ matrix.optional }}
          path: test/host_arduino_sim/out/report-memory-${{ matrix.boardProfile.board }}-${{ matrix.backend }}-optional-${{ matrix.optional }}.json
          if-no-files-found: error

      - name: Upload memory profile stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-memory-stats-${{ matrix.boardProfile.board }}-${{ matrix.backend }}-optional-${{ matrix.optional }}
          path: test/host_arduino_sim/out/stats-memory-${{ matrix.boardProfile.board }}-${{ matrix.backend }}-optional-${{ matrix.optional }}.json
          if-no-files-found: error

  host-sim-memory-report:
    needs: host-memory-profiles
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download memory profile artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: host-memory-*
          merge-multiple: true
          path: .artifacts/host-memory

      - name: Generate consolidated memory profile report
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/generate_host_sim_report.py \
            --mode memory-profiles \
            --artifacts-dir .artifacts \
            --output-md reports/host-sim-memory-profile-report.md \
            --output-json reports/host-sim-memory-profile-report.json \
            --compile-backend-count 2

          cat reports/host-sim-memory-profile-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated memory profile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-sim-memory-profile-report
          path: |
            reports/host-sim-memory-profile-report.md
            reports/host-sim-memory-profile-report.json
          if-no-files-found: error
