name: Sync Remote Workflows

on:
  push:
    paths:
      - .github/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-remote-workflows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'braydenanderson2014/C-Arduino-Libraries' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        id: source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sync configured files to library repositories
        uses: actions/github-script@v9
        env:
          LIBRARY_SYNC_TOKEN: ${{ secrets.LIBRARY_SYNC_TOKEN }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { withApiCredentialFallback } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/library-sync-credentials.cjs`);
            const { syncWorkflows } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync-remote-workflows.cjs`);
            await syncWorkflows({
              core,
              context: { ...context, sha: process.env.SOURCE_SHA },
              request: operation => withApiCredentialFallback(getOctokit, operation, core)
            });
