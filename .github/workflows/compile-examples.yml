name: Compile Examples

# See: https://docs.github.com/en/free-pro-team@latest/actions/reference/events-that-trigger-workflows
on:
  push:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "lib/**"
      - "examples/**"
      - "src/**"
      - "library.properties"
  pull_request:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "lib/**"
      - "examples/**"
      - "src/**"
      - "library.properties"
  schedule:
    # Run every Tuesday at 8 AM UTC to catch breakage caused by changes to external resources (libraries, platforms).
    - cron: "0 8 * * TUE"
  workflow_dispatch:
  repository_dispatch:

jobs:
  discover-monorepo-libraries:
    if: github.repository == 'braydenanderson2014/C-Arduino-Libraries'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      hasTargets: ${{ steps.discover.outputs.hasTargets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Discover library example paths
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          entries = []
          lib_root = Path("lib")

          if lib_root.is_dir():
              for child in sorted(lib_root.iterdir()):
                  if not child.is_dir():
                      continue
                  if not (child / "library.properties").is_file():
                      continue
                  if not (child / "examples").is_dir():
                      continue

                  entries.append({
                      "name": child.name,
                      "path": child.as_posix(),
                      "examples": (child / "examples").as_posix()
                  })

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"matrix={json.dumps(entries)}\\n")
              out.write(f"hasTargets={'true' if entries else 'false'}\\n")
          PY

  build-monorepo:
    if: github.repository == 'braydenanderson2014/C-Arduino-Libraries'
    needs: discover-monorepo-libraries
    runs-on: ubuntu-latest

    env:
      SKETCHES_REPORTS_PATH: sketches-reports

    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJson(needs.discover-monorepo-libraries.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile examples for monorepo library
        if: needs.discover-monorepo-libraries.outputs.hasTargets == 'true'
        uses: arduino/compile-sketches@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: arduino:avr:mega
          platforms: |
            - name: arduino:avr
          libraries: |
            - source-path: ./${{ matrix.library.path }}
          sketch-paths: |
            - ./${{ matrix.library.examples }}
          enable-deltas-report: true
          sketches-report-path: ${{ env.SKETCHES_REPORTS_PATH }}/${{ matrix.library.name }}

      - name: Save monorepo sketches report as workflow artifact
        if: always() && needs.discover-monorepo-libraries.outputs.hasTargets == 'true'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: ${{ env.SKETCHES_REPORTS_PATH }}/${{ matrix.library.name }}
          name: sketches-reports-${{ matrix.library.name }}

  build-standalone:
    if: github.repository != 'braydenanderson2014/C-Arduino-Libraries'
    runs-on: ubuntu-latest

    env:
      SKETCHES_REPORTS_PATH: sketches-reports

    strategy:
      fail-fast: false

      matrix:
        board:
          - fqbn: arduino:avr:nano
            platforms: |
              - name: arduino:avr
          - fqbn: arduino:avr:mega
            platforms: |
              - name: arduino:avr
          - fqbn: arduino:avr:leonardo
            platforms: |
              - name: arduino:avr
          - fqbn: arduino:megaavr:uno2018
            platforms: |
              - name: arduino:megaavr
          - fqbn: arduino:megaavr:nona4809
            platforms: |
              - name: arduino:megaavr
          - fqbn: arduino:sam:arduino_due_x_dbg
            platforms: |
              - name: arduino:sam
          - fqbn: arduino:samd:arduino_zero_edbg
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkr1000
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkrzero
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkrwifi1010
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkrfox1200
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkrwan1300
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkrwan1310
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkrgsm1400
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkrnb1500
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:mkrvidor4000
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:samd:nano_33_iot
            platforms: |
              - name: arduino:samd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile examples (standalone Arduino library layout)
        uses: arduino/compile-sketches@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          enable-deltas-report: true
          sketches-report-path: ${{ env.SKETCHES_REPORTS_PATH }}

      - name: Save standalone sketches report as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: ${{ env.SKETCHES_REPORTS_PATH }}
          name: ${{ env.SKETCHES_REPORTS_PATH }}
