name: Project Health Monitoring

on:
  schedule:
    - cron: "0 * * * *"   # hourly; adjust as needed
  repository_dispatch:
    types: [lint-status-updated, compile-status-updated, testing-status-updated, project-health-refresh]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: read

jobs:
  triage_health:
    runs-on: ubuntu-latest
    steps:
      - name: Update project status based on triage count
        uses: actions/github-script@v9
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          LIBRARY_SYNC_TOKEN: ${{ secrets.LIBRARY_SYNC_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            // ---- CONFIG ----
            const OWNER = "braydenanderson2014"; // user/org that owns the Project
            const PROJECT_NUMBER = 4;            // your user Project (v2) number
            const STATUS_FIELD_NAME = "Status";
            
            // Statuses that contribute to project health calculations
            const HEALTH_STATUSES = [
              "Triage",
              "Challenged", 
              "Wait Room",
              "(Issue) In progress",
              "(Feature) In Progress", 
              "(Documentation) In Progress",
              "(General) In Progress",
              "Backlog",
              "Feature Requests",
              "Potential Duplicates",
              "General Question",
              "Documentation Request",
              "REOPENED!!!"
            ];
            
            const AT_RISK_MIN = 20;   // >= this => At risk (adjusted for additional statuses)
            const OFF_TRACK_MIN = 40; // >= this => Off track (adjusted for additional statuses)
            const NOT_HEALTHY_MIN = 65; // >= this => Not healthy (critical threshold)
            const PASSING_LINT_ISSUE_NUMBER = 26;
            const FAILED_LINT_ISSUE_NUMBER = 27;

            async function countItemLabels(itemNumber) {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber
              });

              return (data.labels || []).length;
            }

            // 1) Fetch project + fields
            const projectQuery = `
              query($login:String!, $num:Int!) {
                user(login:$login) {
                  projectV2(number:$num) {
                    id
                    fields(first:100) {
                      nodes {
                        ... on ProjectV2FieldCommon { id name dataType }
                        ... on ProjectV2SingleSelectField { id name dataType options { id name } }
                      }
                    }
                  }
                }
              }
            `;
            // User Projects v2 require a PAT with project write access, not GITHUB_TOKEN.
            let projectGithub;
            let projectTokenName;
            let proj;
            for (const name of ["GH_PROJECT_TOKEN", "LIBRARY_SYNC_TOKEN"]) {
              const token = (process.env[name] || "").trim();
              if (!token) continue;
              core.setSecret(token);
              const client = new github.constructor({ auth: token });
              try {
                const result = await client.graphql(projectQuery, { login: OWNER, num: PROJECT_NUMBER });
                if (!result.user?.projectV2) {
                  core.warning(`${name} cannot access user project ${OWNER}/${PROJECT_NUMBER}.`);
                  continue;
                }
                projectGithub = client;
                projectTokenName = name;
                proj = result;
                break;
              } catch (error) {
                const accessError = [401, 403, 404].includes(error.status) ||
                  error.errors?.some(e => ["FORBIDDEN", "NOT_FOUND"].includes(e.type));
                if (!accessError) throw error;
                core.warning(`${name} is invalid or cannot access the project; trying the next credential.`);
              }
            }
            if (!projectGithub) {
              core.setFailed("No usable project credential. Renew GH_PROJECT_TOKEN (or LIBRARY_SYNC_TOKEN) with access to user project braydenanderson2014/4 and project write permission (classic PAT: project scope). GITHUB_TOKEN cannot update user Projects v2.");
              return;
            }

            const project = proj.user.projectV2;
            const projectId = project.id;

            const statusField = project.fields.nodes.find(
              f => f.name === STATUS_FIELD_NAME && f.dataType === "SINGLE_SELECT"
            );
            if (!statusField) {
              core.setFailed(`Project single-select field "${STATUS_FIELD_NAME}" not found.`);
              return;
            }
            
            // Verify all health status options exist
            const availableOptions = (statusField.options || []).map(o => o.name);
            const missingStatuses = HEALTH_STATUSES.filter(status => 
              !availableOptions.includes(status)
            );
            
            if (missingStatuses.length > 0) {
              core.warning(`Some health status options not found: ${missingStatuses.join(', ')}`);
              core.info(`Available options: ${availableOptions.join(', ')}`);
            }

            // 2) Count items where Status is one of the health statuses and linked Issue is OPEN
            let totalCount = 0;
            let statusCounts = {};
            
            // Initialize status counts
            HEALTH_STATUSES.forEach(status => {
              statusCounts[status] = 0;
            });
            let after = null;

            do {
              const page = await projectGithub.graphql(`
                query($pid:ID!, $after:String) {
                  node(id:$pid) {
                    ... on ProjectV2 {
                      items(first:100, after:$after) {
                        nodes {
                         content { __typename ... on Issue { state } ... on PullRequest { state } }
                          fieldValues(first:20) {
                            nodes {
                              __typename
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                name
                                field { __typename ... on ProjectV2SingleSelectField { name } }
                              }
                            }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }
              `, { pid: projectId, after });

              const items = page.node.items;
              for (const it of items.nodes) {
                if (!it.content || (it.content.__typename !== "Issue" && it.content.__typename !== "PullRequest")) continue;
                if (it.content.state !== "OPEN") continue;

                const statusVal = (it.fieldValues.nodes || []).find(n =>
                  n.__typename === "ProjectV2ItemFieldSingleSelectValue" &&
                  n.field?.__typename === "ProjectV2SingleSelectField" &&
                  n.field.name === STATUS_FIELD_NAME
                );

                // Count if status is one of our health statuses
                if (statusVal && HEALTH_STATUSES.includes(statusVal.name)) {
                  totalCount++;
                  statusCounts[statusVal.name]++;
                }
              }

              after = items.pageInfo.hasNextPage ? items.pageInfo.endCursor : null;
            } while (after);

            core.info(`Total active work items: ${totalCount}`);
            core.info(`Status breakdown: ${JSON.stringify(statusCounts, null, 2)}`);

            // 3) Read lint status buckets from private tracker issues/PRs
            const passingLintCount = await countItemLabels(PASSING_LINT_ISSUE_NUMBER);
            const failedLintCount = await countItemLabels(FAILED_LINT_ISSUE_NUMBER);
            core.info(`Passing lint libraries (#${PASSING_LINT_ISSUE_NUMBER} labels): ${passingLintCount}`);
            core.info(`Failed lint libraries (#${FAILED_LINT_ISSUE_NUMBER} labels): ${failedLintCount}`);

            // 4) Decide overall project status based on total active work + lint failures
            let statusEnum = "ON_TRACK";
            let healthDescription = "🟢 On Track";
            
            if (totalCount >= NOT_HEALTHY_MIN) {
              statusEnum = "OFF_TRACK"; // GitHub only supports ON_TRACK, AT_RISK, OFF_TRACK
              healthDescription = "🔴 Not Healthy";
            } else if (totalCount >= OFF_TRACK_MIN) {
              statusEnum = "OFF_TRACK";
              healthDescription = "🟠 Off Track";
            } else if (totalCount >= AT_RISK_MIN) {
              statusEnum = "AT_RISK";
              healthDescription = "🟡 At Risk";
            }

            if (failedLintCount > 0) {
              if (failedLintCount >= 5) {
                statusEnum = "OFF_TRACK";
                healthDescription = "🟠 Off Track (Lint Failures)";
              } else if (statusEnum === "ON_TRACK") {
                statusEnum = "AT_RISK";
                healthDescription = "🟡 At Risk (Lint Failures)";
              }
            }

            const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
            
            // Create detailed breakdown for the status update
            const statusBreakdown = HEALTH_STATUSES
              .filter(status => statusCounts[status] > 0)
              .map(status => `• ${status}: **${statusCounts[status]}**`)
              .join('\n');
            
            const body = `**Project Health Summary** (as of ${today})\n\n` +
             `**Overall Status: ${healthDescription}**\n\n` +
             `**Total Active Work Items: ${totalCount}**\n\n` +
             `**Lint Status (Labels):**\n` +
             `• ✅ Passing Lint (#${PASSING_LINT_ISSUE_NUMBER}): **${passingLintCount}**\n` +
             `• ❌ Failed Lint (#${FAILED_LINT_ISSUE_NUMBER}): **${failedLintCount}**\n\n` +
             `**Status Breakdown:**\n${statusBreakdown || '• No active items found'}\n\n` +
             `**Health Thresholds:**\n` +
             `• 🟢 On Track: < ${AT_RISK_MIN}\n` +
             `• 🟡 At Risk: ${AT_RISK_MIN}-${OFF_TRACK_MIN-1}\n` +
             `• 🟠 Off Track: ${OFF_TRACK_MIN}-${NOT_HEALTHY_MIN-1}\n` +
             `• 🔴 Not Healthy: ≥ ${NOT_HEALTHY_MIN}\n\n` +
             `**Tracked Statuses:** ${HEALTH_STATUSES.join(', ')}`;

            // ✅ Correct types: status uses ProjectV2StatusUpdateStatus, dates use Date
            const statusMutation = `
              mutation($projectId: ID!, $body: String!, $status: ProjectV2StatusUpdateStatus!, $start: Date) {
                createProjectV2StatusUpdate(input: {
                  projectId: $projectId,
                  body: $body,
                  status: $status,
                  startDate: $start
                  # targetDate: $target   // optional: add ($target: Date) var if you want a target date
                }) {
                  statusUpdate { id status body }
                }
              }
            `;
            let resp;
            const credentialNames = [projectTokenName, ...["GH_PROJECT_TOKEN", "LIBRARY_SYNC_TOKEN"].filter(name => name !== projectTokenName)];
            for (const name of credentialNames) {
              const token = (process.env[name] || "").trim();
              if (!token) continue;
              core.setSecret(token);
              const client = name === projectTokenName ? projectGithub : new github.constructor({ auth: token });
              try {
                resp = await client.graphql(statusMutation, { projectId, body, status: statusEnum, start: today });
                break;
              } catch (error) {
                const accessError = [401, 403, 404].includes(error.status) ||
                  error.errors?.some(e => ["FORBIDDEN", "NOT_FOUND"].includes(e.type));
                if (!accessError) throw error;
                core.warning(`${name} cannot write the project status update; trying the next credential.`);
              }
            }
            if (!resp) {
              core.setFailed("Neither project credential can write status updates. Renew GH_PROJECT_TOKEN or LIBRARY_SYNC_TOKEN with project write permission for braydenanderson2014/4 (classic PAT: project scope).");
              return;
            }

            core.info(`Posted status update: ${resp.createProjectV2StatusUpdate.statusUpdate.status}`);
            core.info(`Total items contributing to health: ${totalCount}`);
            core.info(`Project health assessment: ${healthDescription}`);
