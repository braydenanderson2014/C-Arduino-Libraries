name: Good First Issue Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage-first-time-reporter:
    runs-on: ubuntu-latest
    name: Label first-time issue reporters and add good-first-issue tag

    steps:
      - name: Process new issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const CONFIG = {
              LABELS: {
                GOOD_FIRST_ISSUE: "good first issue",
                FIRST_TIMER: "first-time reporter"
              },
              LABEL_CONFIG: {
                GOOD_FIRST_ISSUE: {
                  color: "7057ff",
                  description: "Good for newcomers — beginner-friendly tasks highlighted by GitHub for new contributors."
                },
                FIRST_TIMER: {
                  color: "e4e669",
                  description: "Issue filed by a first-time contributor to this repository."
                }
              },
              COMMENT_MARKER: "<!-- AUTO-RESPONSE-ID: first-timer-welcome -->"
            };

            const issue = context.payload.issue;
            if (!issue) {
              console.log("ℹ️ No issue payload found - skipping.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;
            const reporter = issue.user.login;

            // Skip bots
            if (issue.user.type === "Bot") {
              console.log(`ℹ️ Issue #${issueNumber} was opened by a bot (${reporter}) - skipping.`);
              return;
            }

            // ── Helper: ensure a label exists ──────────────────────────────────
            async function ensureLabelExists(labelName, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
                console.log(`🏷️ Label "${labelName}" already exists`);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name: labelName, color, description });
                console.log(`✅ Created label "${labelName}"`);
              }
            }

            // ── Helper: add labels if not already present ──────────────────────
            async function addLabels(labels) {
              const existing = (issue.labels || []).map(l => l.name.toLowerCase());
              const toAdd = labels.filter(l => !existing.includes(l.toLowerCase()));
              if (toAdd.length === 0) {
                console.log("ℹ️ All labels already present");
                return;
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: toAdd });
              console.log(`✅ Added labels: ${toAdd.join(", ")}`);
            }

            // ── Check whether the reporter has filed any previous issue ─────────
            async function isFirstTimeReporter() {
              const { data } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue author:${reporter}`,
                sort: "created",
                order: "desc",
                per_page: 2
              });

              return (data.total_count || 0) <= 1;
            }

            // ── Post welcome comment (idempotent) ──────────────────────────────
            async function postWelcomeComment(isFirstTimer) {
              const existing = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              });

              if (existing.some(c => (c.body || "").includes(CONFIG.COMMENT_MARKER))) {
                console.log("ℹ️ Welcome comment already posted");
                return;
              }

              let body;
              if (isFirstTimer) {
                body =
                  `👋 **Welcome to C-Arduino-Libraries, @${reporter}!** 🎉\n\n` +
                  "Thanks for opening your first issue — we're glad you're here!\n\n" +
                  "We've tagged this issue as **first-time reporter** so maintainers know to provide extra guidance. " +
                  "A maintainer will review it shortly and let you know if any additional details are needed.\n\n" +
                  "**Helpful links while you wait:**\n" +
                  "- 📖 [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) — how to set up the project and submit a PR\n" +
                  "- 🧪 [Host Simulation Tests](../blob/main/test/host_arduino_sim/README.md) — run tests without hardware\n" +
                  "- 🗂️ [Good First Issues](../../issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22) — other beginner-friendly tasks\n\n" +
                  `${CONFIG.COMMENT_MARKER}\n` +
                  "*This is an automated response. A human maintainer will follow up soon.*";
              } else {
                body =
                  `👋 **Thanks for filing another issue, @${reporter}!**\n\n` +
                  "A maintainer will review it shortly. Please make sure the issue includes all relevant details " +
                  "(board model, Arduino core / PlatformIO version, and steps to reproduce for bugs).\n\n" +
                  `${CONFIG.COMMENT_MARKER}\n` +
                  "*This is an automated response.*";
              }

              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
              console.log("✅ Posted welcome comment");
            }

            // ── Main ───────────────────────────────────────────────────────────
            await ensureLabelExists(
              CONFIG.LABELS.GOOD_FIRST_ISSUE,
              CONFIG.LABEL_CONFIG.GOOD_FIRST_ISSUE.color,
              CONFIG.LABEL_CONFIG.GOOD_FIRST_ISSUE.description
            );
            await ensureLabelExists(
              CONFIG.LABELS.FIRST_TIMER,
              CONFIG.LABEL_CONFIG.FIRST_TIMER.color,
              CONFIG.LABEL_CONFIG.FIRST_TIMER.description
            );

            const firstTimer = await isFirstTimeReporter();
            console.log(`ℹ️ First-time reporter: ${firstTimer}`);

            if (firstTimer) {
              await addLabels([CONFIG.LABELS.FIRST_TIMER]);
            }

            await postWelcomeComment(firstTimer);

            console.log(`✅ Finished processing issue #${issueNumber}`);
