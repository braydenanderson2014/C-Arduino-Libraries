name=SimpleArduinoTimer
version=1.2.0
author=Brayden Anderson
maintainer=Brayden Anderson <braydenanderson2014@gmail.com>
sentence=A Simple non-blocking Timer for Arduino with multi-RTC support (DS3231, DS1307, DS1302, PCF8523, PCF8563, MCP7940N).
paragraph=Supports start/stop/pause/resume, target duration checks, auto-scaling remainingTime(), and raw remainingTimeMillis(). Works standalone with millis() or with a supported RTC when useRTCModule is defined before including the header. Select the RTC chip with RTC_CHIP_DS3231 (default), RTC_CHIP_DS1307, RTC_CHIP_PCF8523, RTC_CHIP_PCF8563, RTC_CHIP_MCP7940, or RTC_CHIP_DS1302.
category=Timing
