name=SimpleArduinoTimer
version=1.0.7
author=Brayden Anderson
maintainer=Brayden Anderson <braydenanderson2014@gmail.com>
sentence=A Simple non-blocking Timer for Arduino. Set timers in milliseconds, seconds, minutes, or hours. Optional RTC (DS3231) support via #define useRTCModule.
paragraph=Supports start/stop/pause/resume, target duration checks, auto-scaling remainingTime(), and raw remainingTimeMillis(). Works standalone with millis() or with a DS3231 RTC when useRTCModule is defined before including the header.
