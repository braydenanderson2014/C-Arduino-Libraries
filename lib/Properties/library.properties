name=SimpleProperties
version=1.0.1-BETA
author=Brayden Anderson
maintainer=Brayden Anderson <braydenanderson2014@gmail.com>
sentence=This library provides an easy way to manage Java-style properties on SD, LittleFS, and other Arduino filesystems.
paragraph=This library provides an easy and efficient way to create and save key-value properties. It is built on the Hashtable library, mimics the Java Properties class, and now supports SD by default plus injected filesystems such as LittleFS directly from Properties.h.
category=Data Processing
url=https://github.com/braydenanderson2014/C-Arduino-Libraries/tree/main/lib/Properties
architectures=*
includes=Properties.h
depends= Hashtable, SD