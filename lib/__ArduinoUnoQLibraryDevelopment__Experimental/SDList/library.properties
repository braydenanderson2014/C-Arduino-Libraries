name=SDList
version=2.0.1
author=Brayden Anderson
maintainer=Brayden Anderson <braydenanderson2014@gmail.com>
sentence=Paged, batch-buffered list that offloads elements to SD, LittleFS, or optional UnoQ bridge storage.
paragraph=Stores any trivially-copyable type (int, float, struct) without text serialisation or data corruption. A fixed in-memory batch window keeps RAM usage predictable while the file is pre-allocated to prevent fragmentation. Supports SD card (default), LittleFS (-DUSE_LITTLEFS), and optional UnoQ bridge backends when UnoQBridgeClient is available.
category=Data Processing
