sentence=Paged, batch-buffered list that offloads elements to SD card or LittleFS using binary storage.
paragraph=Stores any trivially-copyable type (int, float, struct) without text serialisation or data corruption. A fixed in-memory batch window keeps RAM usage predictable while the file is pre-allocated to prevent fragmentation. Supports SD card (default) or LittleFS (-DUSE_LITTLEFS).
