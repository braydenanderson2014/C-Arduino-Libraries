name=Queue
version=1.0.1
author=Brayden Anderson
maintainer=Brayden Anderson <braydenanderson2014@gmail.com>
sentence=This library provides an easy and efficient way to create and Manage Queue's in Arduino.
paragraph=A simple Queue implementation that allows you to process data in order. First in First out. This library is designed to be easy to use and efficient. However it is not recommended to use this library on a microcontroller with less than 2KB of RAM. 
category=Data Processing
url=https://github.com/braydenanderson2014/Queue
architectures=*
includes=Queue.h
